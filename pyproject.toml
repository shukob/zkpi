[project]
name = "zkpi"
version = "0.1.0"
description = "Proof-carrying instructions: a venue's decision, provable without the inputs that produced it."
license = { text = "MIT" }
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["zk", "scripts"]
