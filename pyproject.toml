[project]
name = "zkpi"
version = "0.1.0"
description = "Proof-carrying instructions: a venue's decision, provable without the inputs that produced it."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "cryptography>=45",
    "pynacl>=1.5",
]

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["zk", "scripts"]
